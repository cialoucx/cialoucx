<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; letter-spacing: 2.5px; }
    .serif { font-family: ui-serif, Georgia, 'Times New Roman', serif; }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .2 } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#000000" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="0%" r="65%">
      <stop offset="0" stop-color="#C9A66B" stop-opacity=".22"/>
      <stop offset="1" stop-color="#C9A66B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#FAFAF7"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="15.5" stroke="#000000" stroke-opacity=".08"/>

  <text x="56" y="62" class="mono" fill="#6B6B6B">FULL-STACK ENGINEER</text>
  <text x="1144" y="62" class="mono" fill="#6B6B6B" text-anchor="end">CAVITE, PHILIPPINES</text>

  <text x="52" y="190" class="serif" font-size="92" fill="#1A1A1A" letter-spacing="-1.5">Jonalyn Mae <tspan font-style="italic" fill="#8A6A2F">Alag</tspan></text>

  <line x1="56" y1="228" x2="1144" y2="228" stroke="#000000" stroke-opacity=".08"/>

  <circle cx="61" cy="263" r="4" fill="#8A6A2F" class="dot"/>
  <text x="76" y="268" class="mono" fill="#3A3A3A">REAL-TIME SYSTEMS FOR THE WEB</text>
  <text x="1144" y="268" class="mono" fill="#8C8C8C" text-anchor="end">REACT · NODE · POSTGRES</text>
</svg>