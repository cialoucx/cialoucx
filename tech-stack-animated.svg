<svg width="620" height="60" viewBox="0 0 620 60" xmlns="http://www.w3.org/2000/svg">

  <!-- JavaScript -->
  <g transform="translate(0,5)" opacity="0">
    <rect width="50" height="50" rx="10" fill="#F7DF1E"/>
    <text x="25" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">JS</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0s" fill="freeze"/>
  </g>

  <!-- React -->
  <g transform="translate(65,5)" opacity="0">
    <rect width="50" height="50" rx="10" fill="#0d1117"/>
    <g transform="translate(25,25)">
      <circle r="3.5" fill="#61DAFB"/>
      <ellipse rx="17" ry="6.5" fill="none" stroke="#61DAFB" stroke-width="1.8"/>
      <ellipse rx="17" ry="6.5" fill="none" stroke="#61DAFB" stroke-width="1.8" transform="rotate(60)"/>
      <ellipse rx="17" ry="6.5" fill="none" stroke="#61DAFB" stroke-width="1.8" transform="rotate(120)"/>
    </g>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.15s" fill="freeze"/>
  </g>

  <!-- Node.js -->
  <g transform="translate(130,5)" opacity="0">
    <rect width="50" height="50" rx="10" fill="#111"/>
    <path d="M25 6 L42 15.5 V34.5 L25 44 L8 34.5 V15.5 Z" fill="none" stroke="#339933" stroke-width="2"/>
    <text x="25" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#339933" text-anchor="middle">JS</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(195,5)" opacity="0">
    <rect width="50" height="50" rx="10" fill="#0d1117"/>
    <path d="M25 8 C15 8 9 15 9 24 C9 33 15 40 22 42 C22 38 22 34 22 32 C18 31 16 28 16 24 C16 18 20 13 25 13 C30 13 34 18 34 24 C34 28 32 31 28 32 C28 35 28 39 28 42 C35 40 41 33 41 24 C41 15 35 8 25 8 Z" fill="#336791"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.45s" fill="freeze"/>
  </g>

  <!-- Supabase -->
  <g transform="translate(260,5)" opacity="0">
    <rect width="50" height="50" rx="10" fill="#0d1117"/>
    <path d="M27 8 L16 28 H24 L22 42 L34 22 H26 Z" fill="#3FCF8E"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
  </g>

  <!-- MongoDB -->
  <g transform="translate(325,5)" opacity="0">
    <rect width="50" height="50" rx="10" fill="#0d1117"/>
    <path d="M25 6 C25 6 32 16 32 27 C32 35 29 40 25 44 C21 40 18 35 18 27 C18 16 25 6 25 6 Z" fill="#47A248"/>
    <line x1="25" y1="30" x2="25" y2="44" stroke="#47A248" stroke-width="1.5"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.75s" fill="freeze"/>
  </g>

  <!-- Python -->
  <g transform="translate(390,5)" opacity="0">
    <rect width="50" height="50" rx="10" fill="#0d1117"/>
    <path d="M25 8 C20 8 18 10 18 13 V17 H26 V18 H14 C11 18 9 20 9 24 C9 28 11 30 14 30 H17 V26 C17 23 19 20 23 20 H31 C33 20 35 18 35 16 V13 C35 10 31 8 25 8 Z" fill="#3776AB"/>
    <path d="M25 42 C30 42 32 40 32 37 V33 H24 V32 H36 C39 32 41 30 41 26 C41 22 39 20 36 20 H33 V24 C33 27 31 30 27 30 H19 C17 30 15 32 15 34 V37 C15 40 19 42 25 42 Z" fill="#FFD43B"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
  </g>

  <!-- Docker -->
  <g transform="translate(455,5)" opacity="0">
    <rect width="50" height="50" rx="10" fill="#0d1117"/>
    <g fill="#2496ED">
      <rect x="10" y="22" width="7" height="6"/>
      <rect x="18" y="22" width="7" height="6"/>
      <rect x="26" y="22" width="7" height="6"/>
      <rect x="18" y="15" width="7" height="6"/>
      <rect x="26" y="15" width="7" height="6"/>
      <path d="M8 28 C8 28 6 38 16 40 C26 42 38 40 40 28 C36 30 12 30 8 28 Z"/>
    </g>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.05s" fill="freeze"/>
  </g>

  <!-- Git -->
  <g transform="translate(520,5)" opacity="0">
    <rect width="50" height="50" rx="10" fill="#0d1117"/>
    <g transform="translate(25,25) rotate(45)" fill="#F05032">
      <rect x="-2.5" y="-14" width="5" height="10" rx="2"/>
      <rect x="-2.5" y="4" width="5" height="10" rx="2"/>
      <rect x="-2.5" y="-2.5" width="5" height="5" rx="2.5"/>
      <circle cx="-9" cy="-9" r="3"/>
      <circle cx="9" cy="9" r="3"/>
    </g>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/>
  </g>

</svg>
